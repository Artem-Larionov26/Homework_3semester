<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>MyNUnit Web</title>

    <style>
        body
        {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        button
        {
            margin-top: 10px;
        }

        .passed
        {
            color: green;
        }

        .failed
        {
            color: red;
        }

        .ignored
        {
            color: gray;
        }
    </style>
</head>
<body>
    <h1>MyNUnit Web</h1>

    <h2>Upload test assembly</h2>
    <input type="file" id="fileInput" />
    <br />
    <button onclick="upload()">Upload</button>

    <h2>Run tests</h2>
    <button onclick="runTests()">Run</button>

    <h2>Results</h2>
    <div id="results"></div>

    <script>
        const apiBase = window.location.origin;

        async function upload()
        {
            const fileInput = document.getElementById("fileInput");
            if (fileInput.files.length === 0)
            {
                alert("Select a DLL file first");
                return;
            }

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            const response = await fetch(`${apiBase}/api/tests/upload`, {
                method: "POST",
                body: formData
            });

            if (!response.ok)
            {
                const text = await response.text();
                alert("Upload failed: " + text);
                return;
            }

            alert(await response.text());
        }

        async function runTests()
        {
            const response = await fetch(`${apiBase}/api/tests/run`, {
                method: "POST"
            });

            if (!response.ok)
            {
                const text = await response.text();
                alert("Run failed: " + text);
                return;
            }

            const data = await response.json();
            showResults(data.results);
        }

        function showResults(results)
        {
            const container = document.getElementById("results");
            container.innerHTML = "";

            for (const result of results)
            {
                const div = document.createElement("div");
                div.className = result.status.toLowerCase();
                div.innerText =
                    `[${result.status}] ${result.testName} ` +
                    `(${result.executionTimeMs} ms)` +
                    (result.message ? " — " + result.message : "");
                container.appendChild(div);
            }
        }
    </script>
</body>
</html>
