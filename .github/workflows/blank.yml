name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # -------- Linux --------
    - name: Build and Test (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        for sln in $(find . -name "*.sln"); do
          echo "Building $sln"
          dotnet restore "$sln"
          dotnet build "$sln" --no-restore
          dotnet test "$sln" --no-build
        done

    # -------- Windows --------
    - name: Build and Test (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Get-ChildItem -Recurse -Filter *.sln | ForEach-Object {
          Write-Host "Building $($_.FullName)"
          dotnet restore $_.FullName
          dotnet build $_.FullName --no-restore
          dotnet test $_.FullName --no-build
        }
