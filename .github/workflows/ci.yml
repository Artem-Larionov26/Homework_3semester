name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Build and Test all solutions
      run: |
        find . -name "*.sln" | while read sln; do
          echo "Building $sln"
          dotnet restore "$sln"
          dotnet build "$sln" --no-restore
          dotnet test "$sln" --no-build
        done
